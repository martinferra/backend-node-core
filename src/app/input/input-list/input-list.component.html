<div class="container">

  <div class="header">
    <h1>Insumos</h1>
    <mat-paginator></mat-paginator>
    <button mat-icon-button (click)="openInputNewEditDialog()" class="action">
      <mat-icon>add</mat-icon>
    </button>
  </div>
  
  <mat-divider></mat-divider>

  @if (inputList$ | async; as datasource) {  
    <mat-table [dataSource]="datasource">
      <ng-container matColumnDef="name">
        <mat-header-cell *matHeaderCellDef>Nombre</mat-header-cell>
        <mat-cell *matCellDef="let input">{{ input.name }}</mat-cell>
      </ng-container>
      <ng-container matColumnDef="sku">
        <mat-header-cell *matHeaderCellDef>Código</mat-header-cell>
        <mat-cell *matCellDef="let input">{{ input.sku }}</mat-cell>
      </ng-container>
      <ng-container matColumnDef="actions">
        <mat-header-cell *matHeaderCellDef>Acciones</mat-header-cell>
        <mat-cell *matCellDef="let input">
          <button
            mat-icon-button
            class="list-action"
            (click)="openInputNewEditDialog(input)"
            matTooltip="Editar"
          >
            <mat-icon>edit</mat-icon>
          </button>
          <button
            mat-icon-button
            class="list-action"
            (click)="remove(input)"
            matTooltip="Eliminar"
          >
            <mat-icon>delete</mat-icon>
          </button>
        </mat-cell>
      </ng-container>

      <mat-header-row *matHeaderRowDef="columnsToDisplay"></mat-header-row>
      <mat-row *matRowDef="let myRowData; columns: columnsToDisplay"></mat-row>
    </mat-table>
  }

</div>
