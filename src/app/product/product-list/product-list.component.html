<div class="container">

  <div class="header">
    <h1>Productos</h1>
    <mat-paginator></mat-paginator>
    <button mat-icon-button (click)="openProductNewEditDialog()" class="action">
      <mat-icon>add</mat-icon>
    </button>
  </div>
  
  <mat-divider></mat-divider>

  @if (productList$ | async; as datasource) {  
    <mat-table [dataSource]="datasource">
      <ng-container matColumnDef="name">
        <mat-header-cell *matHeaderCellDef>Nombre</mat-header-cell>
        <mat-cell *matCellDef="let product">{{ product.name }}</mat-cell>
      </ng-container>
      <ng-container matColumnDef="sku">
        <mat-header-cell *matHeaderCellDef>C&oacute;digo</mat-header-cell>
        <mat-cell *matCellDef="let product">{{ product.sku }}</mat-cell>
      </ng-container>
      <ng-container matColumnDef="productFamily">
        <mat-header-cell *matHeaderCellDef>Familia</mat-header-cell>
        <mat-cell *matCellDef="let product">{{ product.productFamily.name }}</mat-cell>
      </ng-container>
      <ng-container matColumnDef="actions">
        <mat-header-cell *matHeaderCellDef>Acciones</mat-header-cell>
        <mat-cell *matCellDef="let product">
          <button
            mat-icon-button
            class="list-action"
            (click)="openProductNewEditDialog(product)"
            matTooltip="Editar"
          >
            <mat-icon>edit</mat-icon>
          </button>
          <button
            mat-icon-button
            class="list-action"
            (click)="remove(product)"
            matTooltip="Eliminar"
          >
            <mat-icon>delete</mat-icon>
          </button>
        </mat-cell>
      </ng-container>

      <mat-header-row *matHeaderRowDef="columnsToDisplay"></mat-header-row>
      <mat-row *matRowDef="let myRowData; columns: columnsToDisplay"></mat-row>
    </mat-table>
  }

</div>
