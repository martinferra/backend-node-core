<div class="view-group">
  <span>{{ label }}</span>
  <div class="value-row">
    <span class="value">{{ valueString }}</span>
    @if (showDelta) {
      <div
        class="delta"
        [ngClass]="{'delta-positive': deltaIsPositive, 'delta-negative': !deltaIsPositive}"
      >
        @if (deltaIsPositive) {
          <mat-icon class="delta-positive">arrow_upward</mat-icon>
        } @else {
          <mat-icon class="delta-negative">arrow_downward</mat-icon>
        }
        <span>{{ deltaString }}</span>
        @if (showDeltaPercentage) {
          <span>{{ deltaPercentageString }}</span>
        }
      </div>
    } @else {
      <div class="no-delta">valor original</div>
    }
  </div>
</div>
