@if (productFamily) {
  <h1 mat-dialog-title>{{ productFamily._id ? 'Editar Familia' : 'Nueva Familia' }}</h1>

  <form [formGroup]="checkoutForm" (ngSubmit)="onSubmit()">
    <mat-dialog-content>
      <div class="parameter-wrapper">
        <mat-form-field>
          <mat-label>Nombre</mat-label>
          <input
            matInput
            required
            type="text"
            formControlName="name"
            placeholder="Nombre"
            autocomplete="off"
          />
          <mat-hint>Nombre</mat-hint>
          @if (formValidator.get('name')?.hasErrors()) {
            <mat-error>
              {{ formValidator.get('name')?.errorMessage }}
            </mat-error>
          }
        </mat-form-field>
      </div>
      <div class="parameter-wrapper">
        <app-cost-centers-usage-editor 
          [parentElement]="productFamily"
          [cardFormat]="false"
          (listChangeEmitter)="updateCostCentersUsage($event)"
          (editingEmitter)="editingCostCentersUsage = $event">
        </app-cost-centers-usage-editor>
      </div>
    </mat-dialog-content>

    <mat-dialog-actions align="end">
      <button
        mat-stroked-button
        type="button"
        class="action"
        (click)="cancel()"
      >Cancelar</button>
      <button
        mat-stroked-button
        type="submit"
        class="action"
        [disabled]="disableSubmitButton"
      >Guardar</button>
    </mat-dialog-actions>
  </form>
}
