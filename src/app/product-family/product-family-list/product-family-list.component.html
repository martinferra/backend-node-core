<div class="container">

  <div class="header">
    <h1>Familias de productos</h1>
    <mat-paginator></mat-paginator>
    <button mat-icon-button (click)="openProductFamilyNewEditDialog()" class="action">
      <mat-icon>add</mat-icon>
    </button>
  </div>
  
  <mat-divider></mat-divider>

  @if (productFamilyList$ | async; as datasource) {  
    <mat-table [dataSource]="datasource">
      <ng-container matColumnDef="name">
        <mat-header-cell *matHeaderCellDef>Nombre</mat-header-cell>
        <mat-cell *matCellDef="let productFamily">{{ productFamily.name }}</mat-cell>
      </ng-container>

      <ng-container matColumnDef="actions">
        <mat-header-cell *matHeaderCellDef>Acciones</mat-header-cell>
        <mat-cell *matCellDef="let productFamily">
          <button
            mat-icon-button
            class="list-action"
            (click)="openProductFamilyNewEditDialog(productFamily)"
            matTooltip="Editar"
          >
            <mat-icon>edit</mat-icon>
          </button>
          <button
            mat-icon-button
            class="list-action"
            (click)="openChart(productFamily)"
            matTooltip="Ver gráfico"
          >
            <mat-icon>bar_chart</mat-icon>
          </button>
          <button
            mat-icon-button
            class="list-action"
            (click)="remove(productFamily)"
            matTooltip="Eliminar"
          >
            <mat-icon>delete</mat-icon>
          </button>
        </mat-cell>
      </ng-container>

      <mat-header-row *matHeaderRowDef="columnsToDisplay"></mat-header-row>
      <mat-row *matRowDef="let myRowData; columns: columnsToDisplay"></mat-row>
    </mat-table>
  }

</div>
